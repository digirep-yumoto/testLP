  P.actions = `<div class="sx-card"><h2>課題と打ち手 ― 優先順位つき</h2><p class="sx-mut">点数の低さ × 求職者にとっての重要度 × 着手のしやすさで並べています。離脱ポイントに関わる項目は、優先度を上げています。</p>${R.actions.some(a => a.length) ? R.actions.map((l, i) => l.length ? `<h3 style="margin:14px 0 8px">${['①', '②', '③'][i]} ${H[i]}</h3>${l.map(x => `<div class="sx-li ${i === 0 ? '' : i === 1 ? 'n' : 'a'}"><b>${LM[x.layer]}${x.axl}｜${x.l}（${x.s}点）${x.kao ? ' <span class="sx-chip c">採用の顔で対応</span>' : ''}</b>${x.fix}</div>`).join('')}` : '').join('') : '<p class="sx-mut">40点以下の項目はありません。</p>'}
 ${R.unknownItems.length ? `<h3 style="margin:14px 0 8px">⓪ まず数字を把握する（${R.unknownItems.length}項目）</h3><div class="sx-li a"><b>「把握していない」と答えた項目</b>${R.unknownItems.map(i => esc(i.l)).join('／')}<br><span class="sx-mut">自社の数字を知らないままでは、改善も発信もできません。最初の1ヶ月で数えます。</span></div>` : ''}</div>`;
  const O = R.offer, C = SD.contact || {};
  P.offer = O ? `<div class="sx-card" style="border:2px solid var(--acc)"><h2>ご提案 ― この診断結果から、おすすめする進め方</h2><p class="sx-mut">診断の内容にもとづく提案です。合わないと感じられた場合は、遠慮なくお知らせください。</p>
 <div class="sx-2" style="margin-top:10px"><div class="sx-plan"><small>${O.hold ? 'まず取り組むこと' : 'おすすめのプラン'}</small><b>${SD.plans[O.main].n}</b><div class="sx-pr">${SD.plans[O.main].p}<span>${SD.plans[O.main].t}</span></div><p>${SD.plans[O.main].d}</p></div>
 <div><h3>なぜ、この進め方か</h3>${O.why.map(w => `<div class="sx-li">${w}</div>`).join('')}</div></div>
 ${O.kao.length ? `<h3 style="margin:12px 0 6px">このプランで対応できる課題</h3><div>${O.kao.map(i => `<span class="sx-chip c" style="font-size:12px;padding:3px 12px;margin:0 6px 6px 0">${LM[i.layer]}${i.axl}｜${i.l.replace(/（.*?）/g, '')}</span>`).join('')}</div>` : ''}
 ${O.sns ? '<div class="sx-li g" style="margin-top:8px"><b>SNSについて</b>投稿の代行はしていませんが、採用運用顧問の中で、画像と文章をセットにした投稿素材を月8本お渡しします。投稿するだけで発信が続きます。</div>' : ''}
 <div class="sx-2" style="margin-top:8px"><div class="sx-li n"><b>費用をかけずに、御社だけでできること：${O.selfN}件</b>「課題と打ち手」の①に挙げた項目は、プランを使わなくても今月から始められます。</div><div class="sx-li a"><b>別の選択肢：${SD.plans[O.alt].n}（${SD.plans[O.alt].p}）</b>${SD.plans[O.alt].d}</div></div>
 <div class="sx-next"><div><b>次のステップ：30分の打合せ</b><span>この診断をもとに、①御社の採用キャッチコピー案　②お見積り　③納品までのスケジュール　をお持ちします。ご都合のよい日時を2つお知らせください。</span></div><div><b style="font-size:20px">${esc(C.tel || '')}</b><span>${esc(C.by || '')}（${esc(C.hours || '')}）<br>${esc(C.mail || '')}</span></div></div></div>` : '';
  P.cul = culBlock(R, co);
  P.conf = `<div class="sx-card"><h2>診断の確かさ</h2><div class="sx-row"><span>入力率</span>${bar(R.done, '#27457f')}<b>${R.done}</b><span class="sx-mut">%</span></div><div class="sx-row"><span>把握度</span>${bar(R.known, '#1f9d6b')}<b>${R.known == null ? '―' : R.known}</b><span class="sx-mut">%</span></div><p class="sx-mut" style="margin:8px 0 0">把握度＝答えた設問のうち「把握していない」以外の割合。採点基準：業種「${R.bench.l}」／ターゲット「${SD.targets[R.target].l}」。${SD.note}</p></div>`;
  return P;
}
function vResult(co, R) {
  const P = parts(co, R);
  return `${R.done < 40 ? `<div class="sx-warn">入力が${R.done}%です。結果は参考程度にご覧ください。</div>` : ''}${P.hero}${P.read}<div class="sx-2">${P.axes}${P.conf}</div>${P.pairs}${P.funnel}<div class="sx-2">${P.strong}${P.actions}</div>${P.cul}${P.offer}`;
}
function vDoc() {
  return `<div class="sx-2"><div><div class="sx-card"><h2>この診断の考え方</h2>${SD.doc.concept.map(p => `<p>${p}</p>`).join('')}</div>
 <div class="sx-card"><h2>商談での使い方（20分）</h2><table><tr><th style="width:110px">タイミング</th><th>やること</th></tr>${SD.doc.flow.map(f => `<tr><td><b>${f[0]}</b></td><td>${f[1]}</td></tr>`).join('')}</table></div>
 <div class="sx-card"><h2>採点のしくみ</h2>${SD.doc.scoring.map(p => `<p>${p}</p>`).join('')}</div></div>
 <div><div class="sx-card"><h2>設計の根拠</h2>${SD.doc.theory.map(t => `<div class="sx-li n"><b>${t[0]}</b>${t[1]}</div>`).join('')}</div>
 <div class="sx-card"><h2>採点基準の出典</h2><table><tr><th>基準</th><th>値と出典</th></tr>${SD.sources.map(s => `<tr><td><b>${s.t}</b></td><td>${s.d}${s.url ? `<br><a href="${s.url}" target="_blank" rel="noopener" style="color:var(--ink2);font-size:12px">${s.url}</a>` : ''}</td></tr>`).join('')}</table></div>
 <div class="sx-card"><h2>限界と注意</h2>${SD.doc.limits.map(p => `<div class="sx-li a">${p}</div>`).join('')}</div></div></div>`;
}

/* ---------- レポート ---------- */
function report() {
  const co = cur(), R = calc(co), P = parts(co, R), w = window.open('', '_blank');
  if (!w) { alert('ポップアップがブロックされました。許可してから、もう一度押してください。'); return; }
  w.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>採用スター診断レポート_${esc(co.name)}</title><style>${CSS}
@page{size:A4;margin:12mm}body{margin:0;background:#fff}.sx{max-width:186mm;margin:0 auto;padding:8mm 0;font-size:10pt}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.sx-card,.sx-hero,.sx-li,.sx-pair,.sx-fn{break-inside:avoid}
.sx-card{box-shadow:none;padding:12px 16px;margin-bottom:10px}.sx-hero{grid-template-columns:78mm 1fr;padding:16px 18px;gap:16px}.sx-ty b{font-size:24px}.sx-ty p{font-size:10.5pt}.sx-kp b{font-size:18px}
.cv{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.2mm solid #e8622c;padding-bottom:3mm;margin-bottom:5mm}.cv h1{font-size:20pt;color:#0f1f3d;margin:0}.cv div{text-align:right;color:#6b7488;font-size:9pt}
.pb{break-before:page}.pbtn{position:fixed;right:14px;top:14px;z-index:9}@media print{.pbtn{display:none}.sx{padding:0}}</style></head><body>
<button class="sx-b p pbtn" onclick="print()">印刷／PDFとして保存</button><div class="sx">
<div class="cv"><div style="text-align:left;color:#1c2333"><div style="font-size:9pt;color:#e8622c;font-weight:700;letter-spacing:.14em">RECRUITING STAR REPORT</div><h1>採用スター診断レポート</h1><div style="text-align:left;font-size:12pt;font-weight:700;color:#1c2333;margin-top:1mm">${esc(co.name)} 御中</div></div><div>${today()}<br>${esc(OPT.by || SD.by)}</div></div>
${P.hero}${P.read}<div class="sx-2">${P.axes}${P.conf}</div><div class="pb"></div>${P.pairs}${P.funnel}<div class="pb"></div>${P.strong}${P.actions}${P.cul}${P.offer ? '<div class="pb"></div>' + P.offer : ''}
<div class="sx-card"><h2>この診断について</h2><p style="margin:4px 0">${SD.doc.concept[0]}</p><p class="sx-mut" style="margin:0">${SD.doc.limits.join(' ')}</p></div>
</div></body></html>`); w.document.close();
}

/* ---------- 操作 ---------- */
function touch() { cur().updated = today(); saveS(); }
function onClick(e) {
  const t = e.target.closest('[data-a]'); if (!t || !ROOT.contains(t)) return; const a = t.dataset.a, k = t.dataset.k, v = t.dataset.v, co = cur();
  if (a === 'tab') { V.tab = v; render(); window.scrollTo(0, 0); }
  else if (a === 'sec') { V.sec = v; render(); ROOT.scrollIntoView({ block: 'start' }); }
  else if (a === 'set') { const nv = v === UNK ? UNK : +v; co.ans[k] = co.ans[k] === nv ? '' : nv; touch(); render(); }
  else if (a === 'cul') { co.cul[k] = +co.cul[k] === +v ? '' : +v; touch(); render(); }
  else if (a === 'new') { const n = prompt('会社名を入力してください'); if (n) { const c = blank(n.trim()); S.cos[c.id] = c; S.cur = c.id; V.tab = 'in'; V.sec = 'prof'; saveS(); render(); } }
  else if (a === 'print') report();
  else if (a === 'full') { if (document.fullscreenElement) document.exitFullscreen(); else if (ROOT.requestFullscreen) ROOT.requestFullscreen(); }
  else if (a === 'menu') { V.menu = !V.menu; render(); return; }
  else if (a === 'm1') { const n = JSON.parse(JSON.stringify(co)); n.id = uid(); n.name = co.name + '（' + today() + '）'; S.cos[n.id] = n; S.cur = n.id; saveS(); }
  else if (a === 'm2') { if (confirm('「' + co.name + '」の診断を削除しますか？')) { delete S.cos[S.cur]; S.cur = ''; saveS(); V.menu = false; mount(ROOT, OPT); return; } }
  else if (a === 'm3') { const x = document.createElement('a'); x.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); x.download = '採用スター診断_backup_' + today() + '.json'; x.click(); }
  else if (a === 'm4') { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = () => { const r = new FileReader(); r.onload = () => { try { const j = JSON.parse(r.result); if (!j.cos) throw 0; if (confirm('読み込んだデータ（' + Object.keys(j.cos).length + '社）を、現在のデータに追加・上書きします。')) { Object.assign(S.cos, j.cos); saveS(); render(); } } catch (err) { alert('読み込めませんでした。'); } }; r.readAsText(i.files[0]); }; i.click(); }
  else if (a === 'm5') { const d = demo(); S.cos[d.id] = d; S.cur = d.id; saveS(); }
  if (/^m\d$/.test(a)) { V.menu = false; render(); }
}
function onChange(e) {
  const t = e.target, c = t.dataset && t.dataset.c; if (!c) return; const co = cur();
  if (c === 'pick') { S.cur = t.value; saveS(); render(); return; }
  if (c === 'mode') { V.full = t.checked; render(); return; }
  if (c === 'name') co.name = t.value; else if (c === 'prof') co.prof[t.dataset.k] = t.value; else if (c === 'fn') { co.prof.fn = co.prof.fn || {}; co.prof.fn[t.dataset.k] = t.value; } else if (c === 'ans') co.ans[t.dataset.k] = t.value === '' ? '' : +t.value; else if (c === 'memo') { co.memo = t.value; touch(); return; }
  touch(); render();
}
root.StarApp = { mount, calc, svg, KEY, list: () => Object.values(loadS().cos).map(c => ({ name: c.name, updated: c.updated, R: calc(c) })) };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
